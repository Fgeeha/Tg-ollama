<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="330" viewBox="0 0 1200 330"
     role="img" aria-labelledby="ftitle fdesc">
  <title id="ftitle">How a message is answered</title>
  <desc id="fdesc">A Telegram message passes through access control and rate limiting, then the bot loads recent history from SQLite, sends it to Ollama, and streams the reply back into the same Telegram message. Nothing leaves the host machine.</desc>

  <rect width="1200" height="330" rx="26" fill="#0B1016"/>

  <text x="56" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="18" letter-spacing="2.4" fill="#2AABEE">HOW ONE MESSAGE IS ANSWERED</text>

  <!-- stage 1: telegram -->
  <g transform="translate(56 96)">
    <rect width="232" height="128" rx="16" fill="#111820" stroke="#242C36" stroke-width="1.5"/>
    <circle cx="30" cy="34" r="9" fill="#2AABEE"/>
    <text x="50" y="40" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="21" font-weight="600" fill="#E6EDF3">Telegram</text>
    <text x="22" y="76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="19" fill="#8B949E">Message or photo</text>
    <text x="22" y="104" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="19" fill="#8B949E">from an allowed user</text>
  </g>

  <!-- stage 2: the bot -->
  <g transform="translate(360 96)">
    <rect width="272" height="128" rx="16" fill="#111820" stroke="#2AABEE" stroke-width="1.5"/>
    <text x="22" y="40" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="21" font-weight="600" fill="#E6EDF3">Bot</text>
    <text x="22" y="76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="19" fill="#8B949E">Access, rate limit,</text>
    <text x="22" y="104" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="19" fill="#8B949E">history, token budget</text>
  </g>

  <!-- stage 3: ollama -->
  <g transform="translate(704 96)">
    <rect width="232" height="128" rx="16" fill="#111820" stroke="#242C36" stroke-width="1.5"/>
    <circle cx="30" cy="34" r="9" fill="#3FB950"/>
    <text x="50" y="40" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="21" font-weight="600" fill="#E6EDF3">Ollama</text>
    <text x="22" y="76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="19" fill="#8B949E">Your model, your</text>
    <text x="22" y="104" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="19" fill="#8B949E">hardware</text>
  </g>

  <!-- stage 4: streamed answer -->
  <g transform="translate(1008 96)">
    <rect width="136" height="128" rx="16" fill="#111820" stroke="#242C36" stroke-width="1.5"/>
    <text x="20" y="40" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="21" font-weight="600" fill="#E6EDF3">Reply</text>
    <text x="20" y="76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="19" fill="#8B949E">edited in</text>
    <text x="20" y="104" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="19" fill="#8B949E">place</text>
    <rect x="92" y="88" width="9" height="20" fill="#3FB950"/>
  </g>

  <!-- connections -->
  <g stroke="#3A4450" stroke-width="2" fill="none">
    <path d="M292 160 L356 160"/>
    <path d="M636 160 L700 160"/>
    <path d="M940 160 L1004 160"/>
  </g>
  <g fill="#3A4450">
    <path d="M356 160 l-10 -5 v10 z"/>
    <path d="M700 160 l-10 -5 v10 z"/>
    <path d="M1004 160 l-10 -5 v10 z"/>
  </g>

  <!-- storage note under the bot -->
  <g transform="translate(360 244)">
    <rect width="272" height="42" rx="10" fill="#151B23" stroke="#242C36"/>
    <text x="20" y="27" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="18" fill="#8B949E">SQLite · users · history</text>
  </g>
  <path d="M496 224 L496 244" stroke="#3A4450" stroke-width="2" stroke-dasharray="4 4"/>

  <text x="704" y="272" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
        font-size="19" fill="#6E7A87">No request leaves the host running Ollama.</text>
</svg>
