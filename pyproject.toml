[tool.poetry]
name = "tg-ollama-bot"
version = "1.0.0"
description = "Telegram bot with Ollama integration for AI model interaction"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "bot", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
python-telegram-bot = "^22.5"
sqlalchemy = "^2.0.44"
alembic = "^1.17.1"
asyncpg = "^0.30.0"
python-dotenv = "^1.2.1"
pydantic = "^2.12.4"
pydantic-settings = "^2.12.0"
httpx = "^0.28.1"
structlog = "^25.5.0"
tenacity = "^9.1.2"
aiohttp = "^3.13.2"
aiosqlite = "^0.21.0"


[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.12.0"
ruff = "^0.1.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["E203", "E501"]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
python_files = ["test_*.py", "*_test.py"]
