services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-ollama-bot
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - ollama
    networks:
      - ollama-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - ollama-network
    environment:
      - OLLAMA_HOST=0.0.0.0
    # Uncomment for GPU support (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Optional: PostgreSQL for production
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: bot-postgres
  #   environment:
  #     POSTGRES_DB: tg_ollama_bot
  #     POSTGRES_USER: botuser
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   networks:
  #     - ollama-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U botuser"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  ollama-network:
    driver: bridge

volumes:
  ollama_data:
  # postgres_data:
